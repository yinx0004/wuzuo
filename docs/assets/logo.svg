<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Yuanfang logo">
  <title>Yuanfang</title>
  <!-- App-icon tile: dark, with a faint edge so it also reads on GitHub's dark theme. -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#161c2c" stroke="#2c3348" stroke-width="2"/>
  <!-- Ribbons of the futou (幞头) cap, flying behind. -->
  <path d="M39 50C31 46 21 44 10 46L16 53C24 52 31 54 37 57Z" fill="#f2a33a"/>
  <path d="M37 56C30 62 22 70 16 80L24 79C28 72 33 66 38 62Z" fill="#f2a33a"/>
  <!-- Robe with a crossed collar. -->
  <path d="M28 114C36 101 50 95 64 95C80 95 92 101 98 112L95 118H32Z" fill="#2c3352" stroke="#f3e9d8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M56 96L64 106L72 96" stroke="#f3e9d8" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <path d="M51 96L68 116M77 96L69 106" stroke="#e09a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Ears, face, sideburn. -->
  <circle cx="33" cy="76" r="6" fill="#fde0c2"/>
  <circle cx="96" cy="76" r="6" fill="#fde0c2"/>
  <ellipse cx="64" cy="74" rx="31" ry="28" fill="#fde0c2"/>
  <path d="M36 61H44L40 75Z" fill="#1b1f2e"/>
  <!-- Futou cap: light outline first, then crown, dome, band, gold trim and cloud badge. -->
  <g fill="#f3e9d8" stroke="#f3e9d8" stroke-width="4" stroke-linejoin="round">
    <path d="M48 44C48 18 80 18 80 44Z"/>
    <path d="M33 63C33 37 95 37 95 63C80 58 48 58 33 63Z"/>
  </g>
  <path d="M48 44C48 18 80 18 80 44Z" fill="#20243a"/>
  <path d="M33 63C33 37 95 37 95 63C80 58 48 58 33 63Z" fill="#262a3e"/>
  <path d="M33 58C50 52 78 52 95 58V63C78 57 50 57 33 63Z" fill="#1b1f30"/>
  <path d="M35 56C52 50 76 50 93 56" stroke="#e09a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M57 50a4 4 0 0 1 3-6a5 5 0 0 1 9 0a4 4 0 0 1 3 6z" fill="none" stroke="#e09a3a" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="64.5" cy="46.5" r="1.4" fill="#e09a3a"/>
  <!-- Frowning brow, eye, blush, smirk. -->
  <path d="M42 65L56 70" stroke="#11151c" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="77" r="5" fill="#11151c"/>
  <circle cx="51.8" cy="75" r="1.6" fill="#ffffff"/>
  <ellipse cx="44" cy="87" rx="6" ry="3.5" fill="#f5a3a0"/>
  <path d="M57 89C61 93 67 93 71 88" stroke="#11151c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- The other eye behind a magnifier: "元芳，你怎么看？" -->
  <path d="M88 88L96 112" stroke="#11151c" stroke-width="7" stroke-linecap="round"/>
  <path d="M88 88L96 112" stroke="#e09a3a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="80" cy="76" r="14" fill="#fff5ea" stroke="#11151c" stroke-width="6"/>
  <circle cx="80" cy="76" r="14" fill="none" stroke="#e09a3a" stroke-width="3.5"/>
  <path d="M71 70L86 66" stroke="#11151c" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="80.5" cy="78" r="6.5" fill="#11151c"/>
  <circle cx="83" cy="75.5" r="2.2" fill="#ffffff"/>
  <circle cx="92" cy="101" r="7" fill="#fde0c2" stroke="#11151c" stroke-width="2"/>
  <!-- Spark of insight. -->
  <path d="M100 54L105 46M104 61L112 57M104 67H112" stroke="#f2a33a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
