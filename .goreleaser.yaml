version: 2

project_name: yuanfang

before:
  hooks:
    - go mod tidy

builds:
  - id: yuanfang
    main: ./cmd/yuanfang
    binary: yuanfang
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/yinx0004/yuanfang/internal/version.Version={{ .Version }}
      - -X github.com/yinx0004/yuanfang/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/yinx0004/yuanfang/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md, README.zh-CN.md, docs/*]

checksum:
  name_template: checksums.txt

release:
  # Tags with a suffix (v0.1.0-alpha.1, v0.1.0-rc.1) are published as GitHub
  # pre-releases and are not shown as the latest release.
  prerelease: auto

dockers_v2:
  - images:
      - ghcr.io/yinx0004/yuanfang
    tags:
      - "{{ .Version }}"
      # Pre-releases (v0.1.0-alpha.1) must not move "latest"; empty tags are dropped.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/yinx0004/yuanfang
      org.opencontainers.image.licenses: Apache-2.0

# brew install yinx0004/tap/yuanfang
homebrew_casks:
  - name: yuanfang
    repository:
      owner: yinx0004
      name: homebrew-tap
      # Fine-grained token with "Contents: read and write" on homebrew-tap only.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/yinx0004/yuanfang
    description: AI investigator for production database incidents
    license: Apache-2.0
    # Pre-releases (v0.1.0-alpha.1) are not published to the tap.
    skip_upload: auto
    commit_author:
      name: Sherry Yin
      email: yinx0004@gmail.com
    commit_msg_template: "yuanfang {{ .Tag }}"
    hooks:
      post:
        # The binaries are not signed or notarized; without this, macOS
        # Gatekeeper refuses to run a binary installed from a cask.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/yuanfang"]
          end

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude: ['^docs:', '^test:', '^chore:', '^ci:']
