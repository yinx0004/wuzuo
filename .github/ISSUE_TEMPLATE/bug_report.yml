name: Bug report
description: Something does not work as documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues** (Yuanfang wrote to a target database, data or secrets reached the model or disk, the read-only guard was bypassed) must not be filed here. Report them privately: https://github.com/yinx0004/yuanfang/security/advisories/new
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output. Remove credentials, hostnames and query text you consider sensitive.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      description: A maintainer confirms this and sets the severity label.
      options:
        - "Major: wrong verdict, crash, or a feature unusable"
        - "Minor: there is a workaround, or it is cosmetic"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: yuanfang --version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Database and model
      placeholder: MySQL 8.0.36, model opus
  - type: input
    id: case
    attributes:
      label: Case ID (optional)
      description: "`yuanfang case show <id> --transcript` shows what the model saw. Share only parts you are comfortable sharing."
